[package]
name = "pkgseal-source-arch"
version = "0.1.0"
edition = "2024"
description = "PkgSeal Arch official repositories adapter"
license = "MIT OR Apache-2.0"

[dependencies]
pkgseal-domain = { path = "../../engine/domain" }
pkgseal-source = { path = "../../engine/source" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
regex = "1.10"
async-trait = { workspace = true }
tracing = { workspace = true }
serde_json = "1.0"