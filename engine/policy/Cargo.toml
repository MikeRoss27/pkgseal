[package]
name = "pkgseal-policy"
version = "0.1.0"
edition = "2024"
description = "PkgSeal policy engine — pure, deterministic recommendation without IO"
license = "MIT OR Apache-2.0"

[dependencies]
pkgseal-domain = { path = "../domain" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0"
