[package]
name = "pkgseal-transactions"
version = "0.1.0"
edition = "2024"
description = "PkgSeal transaction planning — inspectable, serializable plans without privileged execution (read-only first)"
license = "MIT OR Apache-2.0"

[dependencies]
pkgseal-domain = { path = "../domain" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
time = { workspace = true, features = ["serde", "formatting", "parsing"] }

[dev-dependencies]
serde_json = "1.0"
