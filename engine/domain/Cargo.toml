[package]
name = "pkgseal-domain"
version = "0.1.0"
edition = "2024"
description = "PkgSeal core domain types — no external dependencies"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde", "js"] }
time = { workspace = true }

[dev-dependencies]
serde_json = "1.0"