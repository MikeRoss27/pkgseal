[package]
name = "pkgseal-desktop"
version = "0.1.0"
edition = "2024"
description = "PkgSeal Tauri 2 desktop application"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"], default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
log = "0.4"
tokio = { workspace = true, features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
indexmap = "2.0"
pkgseal-domain = { path = "../../../engine/domain" }
pkgseal-source = { path = "../../../engine/source" }
pkgseal-resolver = { path = "../../../engine/resolver" }
pkgseal-policy = { path = "../../../engine/policy" }
pkgseal-transactions = { path = "../../../engine/transactions" }
pkgseal-source-arch = { path = "../../../sources/arch" }
pkgseal-source-aur = { path = "../../../sources/aur" }
pkgseal-source-flatpak = { path = "../../../sources/flatpak" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
