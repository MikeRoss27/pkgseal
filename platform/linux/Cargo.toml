[package]
name = "pkgseal-platform-linux"
version = "0.1.0"
edition = "2024"
description = "PkgSeal Linux platform integration — process, filesystem, polkit, privilege boundary"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
tracing = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
pkgseal-domain = { path = "../../engine/domain" }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3.10"
serde_json = "1.0"
